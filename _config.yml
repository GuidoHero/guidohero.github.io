title: Guido A. Herrera-R
name_suffix: "Ph.D."   # shown after the name in the sidebar
logo: images/profile.jpg
description: Conservation and Freshwater Ecologist
google_analytics: G-Q7HHRGFRL6
theme: jekyll-theme-minimal
scholar_name: "Herrera-R, G.A."
# ORCID iD (e.g. "0000-0002-1825-0097"). When set, new papers on ORCID are
# added to _data/publications.yml every week and an ORCID link is shown.
orcid: "0000-0001-5686-6362"
exclude: [scripts, Gemfile, Gemfile.lock, vendor, .bundle]
# Publication list: "condensed" (short author lists, DOI/PDF links) or "full"
publication_style: condensed
# Years before this are folded under "Show older publications" (0 = show all)
publication_collapse_before: 2020
# Image shown when the site is shared (LinkedIn, Slack, email previews)
defaults:
  - scope:
      path: ""
    values:
      image: /images/profile.jpg
